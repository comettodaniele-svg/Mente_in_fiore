name: APK Android

# A ogni modifica su main: costruisce l'app Android e la pubblica come "Release" scaricabile.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # L'immagine Ubuntu 24.04 di GitHub include già l'Android SDK.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Installa e costruisci la parte web
        env:
          VITE_BUILD: ${{ github.run_number }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Costruisci l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}

      - name: Rinomina l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MenteInFiore.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MenteInFiore-apk
          path: MenteInFiore.apk

      - name: Pubblica la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Mente in fiore 0.1.${{ github.run_number }}
          body: |
            Versione di prova. Scarica **MenteInFiore.apk** qui sotto e aprila sul telefono Android
            (la prima volta Android chiede di consentire l'installazione da questa fonte).
          files: MenteInFiore.apk

      # Il file letto dall'app per sapere se c'è un aggiornamento, su un ramo a parte ("update").
      - name: Pubblica version.json per gli aggiornamenti nell'app
        run: |
          N=${{ github.run_number }}
          mkdir upd && cd upd
          printf '{"build": %s, "version": "0.1.%s", "apk": "https://github.com/%s/releases/download/v0.1.%s/MenteInFiore.apk"}\n' "$N" "$N" "${{ github.repository }}" "$N" > version.json
          cat version.json
          git init -q -b update
          git add version.json
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Versione 0.1.$N"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" update
